quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8086}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${NOTIFICATION_DB_USER:notifications}
quarkus.datasource.password=${NOTIFICATION_DB_PASSWORD}
quarkus.datasource.jdbc.url=${NOTIFICATION_JDBC_URL:jdbc:postgresql://localhost:5438/notification_db}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
app.internal-key=${INTERNAL_API_KEY}

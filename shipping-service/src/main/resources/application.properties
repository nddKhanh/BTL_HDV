quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8085}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SHIPPING_DB_USER:shipping}
quarkus.datasource.password=${SHIPPING_DB_PASSWORD}
quarkus.datasource.jdbc.url=${SHIPPING_JDBC_URL:jdbc:postgresql://localhost:5437/shipping_db}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
app.internal-key=${INTERNAL_API_KEY}

services:
  ai-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_db"]
      interval: 5s
      retries: 15
volumes:
  ai-data:

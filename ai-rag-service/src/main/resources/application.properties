quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8083}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${AI_DB_USER:knowledge}
quarkus.datasource.password=${AI_DB_PASSWORD}
quarkus.datasource.jdbc.url=${AI_JDBC_URL:jdbc:postgresql://localhost:5435/knowledge_db}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.swagger-ui.always-include=true
quarkus.rest-client.catalog-api.url=${CATALOG_BASE_URL:http://localhost:8081}
quarkus.rest-client.catalog-api.connect-timeout=2000
quarkus.rest-client.catalog-api.read-timeout=5000
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_CHAT_MODEL:gpt-4o-mini}
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.max-retries=1
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
quarkus.langchain4j.pgvector.dimension=1536
quarkus.langchain4j.pgvector.table=embeddings
quarkus.langchain4j.pgvector.create-table=true
quarkus.langchain4j.pgvector.drop-table-first=false
quarkus.langchain4j.pgvector.register-vector-pg-extension=true
app.internal-key=${INTERNAL_API_KEY}
app.admin-key=${ADMIN_API_KEY}
app.rag.min-score=${RAG_MIN_SCORE:0.65}

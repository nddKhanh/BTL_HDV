quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8084}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PAYMENT_DB_USER:payments}
quarkus.datasource.password=${PAYMENT_DB_PASSWORD}
quarkus.datasource.jdbc.url=${PAYMENT_JDBC_URL:jdbc:postgresql://localhost:5436/payment_db}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
app.internal-key=${INTERNAL_API_KEY}

# HTTP - local host port for Order Service
quarkus.http.port=${PORT:8082}
quarkus.http.host=0.0.0.0

# PostgreSQL owned only by Order Service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORDER_DB_USER:orders}
quarkus.datasource.password=${ORDER_DB_PASSWORD}
quarkus.datasource.jdbc.url=${ORDER_JDBC_URL:jdbc:postgresql://localhost:5434/order_db}
quarkus.datasource.jdbc.max-size=16

# Flyway owns schema creation; Hibernate only validates it
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

# Catalog REST client. Base/default integration target follows the shared guide.
quarkus.rest-client.catalog-api.url=${CATALOG_BASE_URL:http://localhost:8081}
quarkus.rest-client.catalog-api.connect-timeout=2000
quarkus.rest-client.catalog-api.read-timeout=5000
%dev.quarkus.rest-client.catalog-api.url=${CATALOG_BASE_URL:http://localhost:8082/mock-catalog}
%test.quarkus.rest-client.catalog-api.url=http://localhost:8082/mock-catalog

# Demo secrets only. Replace them through environment variables before integration.
app.internal-key=${INTERNAL_API_KEY}
app.mock-catalog.enabled=${MOCK_CATALOG_ENABLED:false}
%dev.app.mock-catalog.enabled=true
%test.app.mock-catalog.enabled=true

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Order Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Order microservice theo Contract V1.0

# Logs are intentionally free of checkout keys and customer PII.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [requestId=%X{requestId}] [%c{2.}] (%t) %s%e%n

# Fault-injection controls are never exposed outside the test profile.
%test.quarkus.datasource.password=orders_dev_password
%test.app.internal-key=dev-internal-key-change-me
%test.app.mock-catalog.test-controls-enabled=true

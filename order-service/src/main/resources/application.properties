quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8082}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORDER_DB_USER:orders}
quarkus.datasource.password=${ORDER_DB_PASSWORD}
quarkus.datasource.jdbc.url=${ORDER_JDBC_URL:jdbc:postgresql://localhost:5434/order_db}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
app.internal-key=${INTERNAL_API_KEY}
app.catalog-base-url=${CATALOG_BASE_URL:http://localhost:8081}
app.payment-base-url=${PAYMENT_BASE_URL:http://localhost:8084}
app.shipping-base-url=${SHIPPING_BASE_URL:http://localhost:8085}
app.notification-base-url=${NOTIFICATION_BASE_URL:http://localhost:8086}

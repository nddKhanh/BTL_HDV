name: Commerce services CI

on:
  push:
    paths:
      - 'order-service/**'
      - 'payment-service/**'
      - 'shipping-service/**'
      - 'notification-service/**'
      - '.github/workflows/commerce-ci.yml'
  pull_request:
    paths:
      - 'order-service/**'
      - 'payment-service/**'
      - 'shipping-service/**'
      - 'notification-service/**'
      - '.github/workflows/commerce-ci.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, payment-service, shipping-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package ${{ matrix.service }}
        run: ./catalog-service/mvnw -f ${{ matrix.service }}/pom.xml verify

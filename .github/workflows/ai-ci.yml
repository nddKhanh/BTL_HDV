name: AI RAG Service CI

on:
  push:
    paths:
      - "ai-rag-service/**"
      - ".github/workflows/ai-ci.yml"
  pull_request:
    paths:
      - "ai-rag-service/**"
      - ".github/workflows/ai-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      ai-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: knowledge_db
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: ci_ai_pass
        ports:
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U knowledge -d knowledge_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    defaults:
      run:
        working-directory: ai-rag-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          cache-dependency-path: "ai-rag-service/pom.xml"

      - name: Package and run tests with Maven
        env:
          AI_DB_USER: knowledge
          AI_DB_PASSWORD: ci_ai_pass
          AI_JDBC_URL: jdbc:postgresql://localhost:5435/knowledge_db
          INTERNAL_API_KEY: ci_internal_secret_key_2026
          ADMIN_API_KEY: ci_admin_secret_key_2026
          OPENAI_API_KEY: demo-ci-key
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean package

      - name: Build Docker image (JVM fast-jar)
        run: docker build -t ai-rag-service:ci .

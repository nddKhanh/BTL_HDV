quarkus.http.port=${PORT:8081}
quarkus.http.host=0.0.0.0
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${CATALOG_DB_USER:catalog}
quarkus.datasource.password=${CATALOG_DB_PASSWORD}
quarkus.datasource.jdbc.url=${CATALOG_JDBC_URL:jdbc:postgresql://localhost:5433/catalog_db}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.swagger-ui.always-include=true
app.internal-key=${INTERNAL_API_KEY}
app.admin-key=${ADMIN_API_KEY}
%test.quarkus.http.test-port=0
